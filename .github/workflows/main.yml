name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
      
      - name: Fix Project Structure
        run: |
          if [ ! -f package.json ]; then
            echo '{"name":"apnabazaar","version":"1.0.0","dependencies":{"@capacitor/core":"latest","@capacitor/cli":"latest","@capacitor/android":"latest"}}' > package.json
          fi
          npm install
          mkdir -p www
          echo "<h1>Apna Bazaar Pakistan Loading...</h1>" > www/index.html
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apna-bazaar-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
