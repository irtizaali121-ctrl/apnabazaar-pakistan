name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build APK
        run: |
          python3 << 'PY'
          import os
          os.system("rm -rf android")
          os.makedirs("android/app/src/main/java/com/apnabazaar/app", exist_ok=True)
          open("android/settings.gradle","w").write("include ':app'")
          open("android/gradle.properties","w").write("android.useAndroidX=true\nandroid.enableJetifier=true\norg.gradle.jvmargs=-Xmx2g")
          open("android/build.gradle","w").write("buildscript { repositories { google(); mavenCentral() } dependencies { classpath 'com.android.tools.build:gradle:8.2.2' } } allprojects { repositories { google(); mavenCentral() } }")
          open("android/app/build.gradle","w").write("plugins { id 'com.android.application' } android { namespace 'com.apnabazaar.app'; compileSdk 34; defaultConfig { applicationId 'com.apnabazaar.app'; minSdk 22; targetSdk 34; versionCode 1; versionName '1.0' } compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 } } dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }")
          open("android/app/src/main/AndroidManifest.xml","w").write('<manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><application android:label="Apna Bazaar" android:theme="@android:style/Theme.NoTitleBar"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>')
          open("android/app/src/main/java/com/apnabazaar/app/MainActivity.java","w").write('package com.apnabazaar.app; import android.app.Activity; import android.os.Bundle;
