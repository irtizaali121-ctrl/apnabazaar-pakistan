<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apna Bazaar Pakistan - Sasta Bazar</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#f5f5f5}
.header{background:#ff6f00;color:white;padding:15px;position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:bold;font-size:20px}
.cart-icon{background:white;color:#ff6f00;padding:5px 12px;border-radius:20px;font-weight:bold}
.banner{background:linear-gradient(135deg,#ff6f00,#ffab40);color:white;padding:25px;text-align:center}
.search{margin:15px;padding:0 15px}
.search input{width:100%;padding:12px;border-radius:10px;border:1px solid #ddd}
.products{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:15px}
.card{background:white;border-radius:12px;overflow:hidden;box-shadow:0 2px 5px #ddd}
.card img{width:100%;height:130px;object-fit:cover}
.card-body{padding:10px}
.price{color:#ff6f00;font-weight:bold;margin:5px 0}
.card button{width:100%;background:#ff6f00;color:white;border:none;padding:8px;border-radius:8px;margin-top:5px}
#cartView{display:none;position:fixed;bottom:0;left:0;right:0;background:white;padding:20px;border-radius:20px 20px 0 0;box-shadow:0 -5px 20px rgba(0,0,0,0.2);max-height:80vh;overflow-y:auto}
.cart-item{display:flex;justify-content:space-between;margin:10px 0;border-bottom:1px solid #eee;padding-bottom:5px}
.order-btn{background:#25D366;color:white;width:100%;padding:15px;border:none;border-radius:10px;font-size:18px;font-weight:bold;margin-top:15px}
.close-btn{background:#eee;padding:10px;width:100%;border:none;border-radius:10px;margin-top:10px}
</style>
</head>
<body>
<div class="header">
<div class="logo">🛒 Apna Bazaar</div>
<div class="cart-icon" onclick="showCart()">🛍️ <span id="cartCount">0</span></div>
</div>
<div class="banner">
<h2>Pakistan ka Apna Sasta Bazar!</h2>
<p>Free Delivery Karachi - Cash on Delivery</p>
</div>
<div class="search">
<input type="text" id="search" placeholder="Search products... kurta, shoes..." onkeyup="searchProduct()">
</div>
<div class="products" id="products"></div>

<div id="cartView">
<h3>Aap ki Tokri 🛒</h3>
<div id="cartItems"></div>
<h3 style="margin-top:15px">Total: Rs. <span id="total">0</span></h3>
<button class="order-btn" onclick="orderWhatsApp()">WhatsApp par Order Karo</button>
<button class="close-btn" onclick="hideCart()">Band Karo</button>
</div>

<script>
let products=[
{name:"Gents Kameez Shalwar",price:2500,img:"https://images.unsplash.com/photo-1596755094514-f87e34085b2c?w=400"},
{name:"Ladies Lawn Suit",price:3200,img:"https://images.unsplash.com/photo-1610030469983-98e550d6193c?w=400"},
{name:"Peshawari Chappal",price:1800,img:"https://images.unsplash.com/photo-1543163521-1bf539c55dd2?w=400"},
{name:"Sports Shoes",price:3500,img:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400"},
{name:"Smart Watch",price:4500,img:"https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400"},
{name:"Perfume - J. Brand",price:2200,img:"https://images.unsplash.com/photo-1594035910387-fea47794261f?w=400"},
{name:"Wallet Leather",price:1200,img:"https://images.unsplash.com/photo-1627123424574-724758594e93?w=400"},
{name:"Sunglasses",price:1500,img:"https://images.unsplash.com/photo-1572635196237-14b3f281503f?w=400"}
];
let cart=[];
function showProducts(list){
let html="";
list.forEach((p,i)=>{
html+=`<div class="card"><img src="${p.img}"><div class="card-body"><b>${p.name}</b><div class="price">Rs. ${p.price}</div><button onclick="addToCart(${i})">Add to Cart</button></div></div>`;
});
document.getElementById("products").innerHTML=html;
}
showProducts(products);
function addToCart(i){cart.push(products[i]);document.getElementById("cartCount").innerText=cart.length;alert(products[i].name+" add ho gaya!");}
function showCart(){
if(cart.length==0){alert("Tokri khali hai!");return;}
let items="";let total=0;
cart.forEach((c,idx)=>{items+=`<div class="cart-item"><span>${c.name}</span><span>Rs.${c.price} <a href="#" onclick="removeItem(${idx})">❌</a></span></div>`;total+=c.price;});
document.getElementById("cartItems").innerHTML=items;
document.getElementById("total").innerText=total;
document.getElementById("cartView").style.display="block";
}
function hideCart(){document.getElementById("cartView").style.display="none";}
function removeItem(i){cart.splice(i,1);document.getElementById("cartCount").innerText=cart.length;showCart();if(cart.length==0)hideCart();}
function searchProduct(){let q=document.getElementById("search").value.toLowerCase();let f=products.filter(p=>p.name.toLowerCase().includes(q));showProducts(f);}
function orderWhatsApp(){
let total=document.getElementById("total").innerText;
let msg="Assalam-o-Alaikum! Apna Bazaar Order:%0A";
cart.forEach(c=>{msg+=`- ${c.name} Rs.${c.price}%0A`;});
msg+=`Total: Rs.${total}%0A%0AName:%0AAddress:%0A`;
window.open("https://wa.me/923001234567?text="+msg,"_blank");
}
</script>
</body>
</html>
