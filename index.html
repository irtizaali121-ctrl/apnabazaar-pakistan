/* Modern Card - Paste in <style> */
.modern-card {
  background: #FFFFFF;
  border-radius: 16px;
  border: 1px solid #F3F4F6;
  overflow: hidden;
  transition: all 0.3s ease;
}
.modern-card:hover {
  border-color: #FF6B00;
  box-shadow: 0 12px 24px rgba(0,0,0,0.08);
  transform: translateY(-2px);
}
.modern-card img {
  width: 100%;
  aspect-ratio: 1/1;
  object-fit: cover;
}
.card-content { padding: 12px; }
.price { 
  font-weight: 700; 
  font-size: 16px; 
  color: #111827;
  font-family: 'Inter', sans-serif;
}
.title {
  font-size: 14px;
  color: #374151;
  line-height: 1.4;
  height: 40px;
  overflow: hidden;
}
.meta {
  font-size: 12px;
  color: #9CA3AF;
  margin-top: 6px;
}
