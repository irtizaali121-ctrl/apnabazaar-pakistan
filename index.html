<!DOCTYPE html>
<html lang="en" id="htmlRoot">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apna Bazaar Pakistan - Complete App</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Noto+Nastaliq+Urdu&display=swap" rel="stylesheet">
<script>tailwind.config={darkMode:'class'}</script>
<style>body{font-family:'Poppins',sans-serif}.urdu{font-family:'Noto Nastaliq Urdu',serif}</style>
</head>
<body class="bg-[#f6f8f7] dark:bg-zinc-900 text-zinc-900 dark:text-white pb-24 transition">

<!-- HEADER: Logo, Search, Location, Theme, Lang -->
<header class="sticky top-0 z-30 bg-white/90 dark:bg-zinc-800/90 backdrop-blur border-b border-gray-100 dark:border-zinc-700 px-4 py-3">
  <div class="max-w-6xl mx-auto flex justify-between items-center gap-2">
    <div class="flex items-center gap-2"><div class="w-9 h-9 bg-green-600 rounded-xl flex items-center justify-center text-white font-bold">A</div><div><h1 class="font-bold leading-none text-[15px]" data-en="Apna Bazaar" data-ur="اپنا بازار">Apna Bazaar</h1><p class="text-[9px] font-bold text-green-600 tracking-widest">PAKISTAN • PKR</p></div></div>
    <div class="flex items-center gap-2">
      <select id="citySelect" class="text-[11px] bg-gray-100 dark:bg-zinc-700 px-2 py-1.5 rounded-full"><option>Lahore</option><option>Karachi</option><option>Islamabad</option><option>Multan</option><option>Peshawar</option></select>
      <button onclick="toggleLang()" class="text-[11px] bg-black dark:bg-white text-white dark:text-black px-3 py-1.5 rounded-full font-bold">اردو / EN</button>
      <button onclick="toggleTheme()" class="w-8 h-8 bg-gray-100 dark:bg-zinc-700 rounded-full">🌙</button>
      <button onclick="openAuth()" id="profileBtn" class="w-8 h-8 bg-green-100 rounded-full flex items-center justify-center">👤</button>
    </div>
  </div>
  <div class="max-w-6xl mx-auto mt-3 flex gap-2">
    <div class="flex-1 bg-gray-100 dark:bg-zinc-700 rounded-full px-4 py-2.5 flex items-center gap-2"><span>🔍</span><input id="searchInput" oninput="doSearch()" data-en-ph="Search products..." data-ur-ph="مصنوعات تلاش کریں..." placeholder="Search products..." class="w-full bg-transparent outline-none text-sm"></div>
    <button onclick="showPage('sell')" class="bg-green-600 text-white px-5 py-2.5 rounded-full text-sm font-bold">+ Sell</button>
  </div>
</header>

<main class="max-w-6xl mx-auto px-4">

<!-- HOME PAGE: All Product Sections -->
<div id="page-home">
  <div class="mt-4 bg-black dark:bg-zinc-800 rounded-[24px] p-5 text-white flex justify-between"><div><span class="bg-white/20 text-[10px] px-2 py-1 rounded-full">✓ PROTECTED</span><h2 class="font-bold text-xl mt-2" data-en="Shop With Protection" data-ur="تحفظ کے ساتھ خریداری">Shop With Protection</h2><p class="text-xs opacity-70">JazzCash • Easypaisa • Cards</p></div><div class="text-4xl">🛡️</div></div>
  
  <!-- Categories 9 as per list -->
  <div class="mt-6"><div class="flex justify-between"><h3 class="font-bold" data-en="Categories (9)" data-ur="زمرہ جات (9)">Categories (9)</h3><button onclick="showPage('categories')" class="text-xs text-green-600 font-bold">View All</button></div>
  <div id="catGrid" class="grid grid-cols-3 gap-2 mt-3"></div></div>

  <div class="mt-6 flex gap-2 overflow-auto"><button onclick="filterType('featured')" class="bg-black text-white text-xs px-4 py-2 rounded-full">Featured</button><button onclick="filterType('latest')" class="bg-white dark:bg-zinc-800 border text-xs px-4 py-2 rounded-full">Latest</button>
